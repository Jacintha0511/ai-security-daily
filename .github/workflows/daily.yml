name: Public daily and Pages

on:
  schedule:
    - cron: '15 17 * * *' # 01:15 Asia/Shanghai next day
    - cron: '45 17 * * *' # 01:45 early catch-up
    - cron: '15 0 * * *'  # 08:15 Asia/Shanghai
    - cron: '15 2 * * *'  # 10:15 catch-up
    - cron: '15 1 * * 0'  # Sunday 09:15 weekly
  workflow_dispatch:
    inputs:
      mode:
        description: Report to generate
        type: choice
        options: [daily, weekly, all]
        default: all
      force:
        description: Recollect even if today's report is already usable
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['daily.py', 'enrich.py', 'test_*.py', 'config.json', 'requirements.txt', 'site/**', '.github/workflows/daily.yml']

permissions:
  contents: read

concurrency:
  group: public-daily-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      collection_failed: ${{ steps.health.outputs.failed }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Test public boundaries and report behavior
        run: python -m unittest -v
      - name: Collect public sources
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          MODE: ${{ inputs.mode }}
          FORCE: ${{ inputs.force }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          mode="${MODE:-daily}"
          if [ "$SCHEDULE" = "15 1 * * 0" ]; then mode="weekly"; fi
          if [ "$EVENT_NAME" = "push" ]; then mode="all"; fi
          if [ "$mode" != "weekly" ]; then
            if [ "$FORCE" = "true" ]; then
              python daily.py daily --force
            else
              python daily.py daily
            fi
          fi
          python enrich.py import-news
          if [ "$mode" = "all" ] || [ "$mode" = "weekly" ]; then python daily.py weekly; fi
      - name: Save durable public history
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'data: update public digest and star history'
            git push origin HEAD:main
          fi
      - name: Read actual collection result
        id: health
        shell: bash
        run: |
          python -c "import json,os; from pathlib import Path; m=json.loads(Path('data/manifest.json').read_text()); failed=(m.get('latest_attempt') or {}).get('status')=='failed'; f=open(os.environ['GITHUB_OUTPUT'],'a'); f.write('failed='+str(failed).lower()+'\n'); f.close()"
      - run: python daily.py build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  collection-health:
    needs: [build, deploy]
    if: needs.build.outputs.collection_failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Mark all-source failure honestly
        run: |
          echo 'All configured live sources failed. The site retains the previous usable digest and publishes a failure status.'
          exit 1

